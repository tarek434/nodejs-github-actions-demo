name: Node.js CI/CD

on: 
  push:
    branches:
      - main

jobs:
  lint: 
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm' 
      
      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  test: 
    name: Test
    runs-on: ubuntu-latest
    steps:
        - name: Checkout code
          uses: actions/checkout@v4
        
        - name: Set up Node.js
          uses: actions/setup-node@v4
          with:
            node-version: '22'
            cache: 'npm'
        
        - name: Install dependencies
          run: npm ci

        - name: Check JavaScript syntax
          run: node --check src/index.js

  build:
    name: Build
    runs-on: ubuntu-latest

    needs: 
      - lint
      - test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
      
      - name: Build application
        run: npm run build

      - name: Verify build output
        run: | 
          echo "Build Directory Contents:"
          ls -la dist

  docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    needs:
      - build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/nodejs-github-actions-demo:latest
            ${{ secrets.DOCKER_USERNAME }}/nodejs-github-actions-demo:${{ github.run_number }}

      - name: Checkout Config Repository
        uses: actions/checkout@v4
        with:
          repository: 'tarek434/node-js-config'
          ref: 'main'
          token: ${{ secrets.CONFIG_REPO_PAT }}
          path: 'config-repo'

      - name: Update Deployment Manifest & Push
        working-directory: config-repo
        run: |
          sed -i "s|image: .*|image: ${{ secrets.DOCKER_USERNAME }}/nodejs-github-actions-demo:${{ github.run_number }}|g" deployment.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add deployment.yaml
          git diff --quiet && git diff --staged --quiet || (git commit -m "ci: update image tag to run #${{ github.run_number }}" && git push origin main)
